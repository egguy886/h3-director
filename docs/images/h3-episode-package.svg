<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">H3 Director episode package</title>
  <desc id="desc">A production folder connects prompts, assets, upload map, continuity, and a merged report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101923"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#ff7043"/><stop offset="1" stop-color="#ffad8d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#ffad8d" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">H3 DIRECTOR · DELIVERY CONTRACT</text>
  <text x="64" y="116" fill="#edf4fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">One episode. One folder. One source of truth.</text>
  <text x="64" y="150" fill="#9eafbf" font-family="Arial, sans-serif" font-size="17">Prompts, references, continuity and novel-art QA stay navigable after generation.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="204" width="260" height="300" rx="18" fill="#182330" stroke="#385067"/>
    <rect x="64" y="204" width="260" height="56" rx="18" fill="url(#accent)"/>
    <text x="88" y="239" fill="#130c0a" font-family="Arial, sans-serif" font-size="20" font-weight="700">EP001/</text>
    <text x="91" y="292" fill="#edf4fb" font-family="Consolas, monospace" font-size="16">prompts/</text>
    <text x="91" y="330" fill="#edf4fb" font-family="Consolas, monospace" font-size="16">assets/</text>
    <text x="91" y="368" fill="#edf4fb" font-family="Consolas, monospace" font-size="16">upload-map/</text>
    <text x="91" y="406" fill="#edf4fb" font-family="Consolas, monospace" font-size="16">continuity/</text>
    <text x="91" y="444" fill="#ffad8d" font-family="Consolas, monospace" font-size="16">report/</text>
    <text x="91" y="476" fill="#9eafbf" font-family="Arial, sans-serif" font-size="13">self-contained handoff</text>
  </g>

  <g stroke="#ffad8d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M350 276 C410 276 420 236 468 236"/><path d="M350 330 C410 330 420 326 468 326"/><path d="M350 384 C410 384 420 416 468 416"/><path d="M350 438 C410 438 420 506 468 506"/>
  </g>
  <g fill="#ffad8d"><circle cx="350" cy="276" r="5"/><circle cx="350" cy="330" r="5"/><circle cx="350" cy="384" r="5"/><circle cx="350" cy="438" r="5"/></g>

  <g filter="url(#shadow)">
    <rect x="468" y="196" width="300" height="92" rx="16" fill="#121923" stroke="#385067"/>
    <rect x="468" y="306" width="300" height="92" rx="16" fill="#121923" stroke="#385067"/>
    <rect x="468" y="416" width="300" height="92" rx="16" fill="#121923" stroke="#385067"/>
  </g>
  <text x="494" y="232" fill="#43d17a" font-family="Arial, sans-serif" font-size="18" font-weight="700">PROMPT SOURCE</text>
  <text x="494" y="260" fill="#9eafbf" font-family="Arial, sans-serif" font-size="15">8 validated .txt modules</text>
  <text x="494" y="342" fill="#ffad8d" font-family="Arial, sans-serif" font-size="18" font-weight="700">VISUAL REFERENCES</text>
  <text x="494" y="370" fill="#9eafbf" font-family="Arial, sans-serif" font-size="15">characters · scenes · props · keyframes</text>
  <text x="494" y="452" fill="#ffad8d" font-family="Arial, sans-serif" font-size="18" font-weight="700">HANDOFF STATE</text>
  <text x="494" y="480" fill="#9eafbf" font-family="Arial, sans-serif" font-size="15">Picture map · continuity · observed endpoint</text>

  <path d="M794 350 H882" stroke="#ffad8d" stroke-width="3" stroke-linecap="round"/><path d="m866 334 18 16-18 16" fill="none" stroke="#ffad8d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="884" y="228" width="250" height="244" rx="18" fill="#182330" stroke="#ff7043" stroke-width="2"/>
  </g>
  <text x="912" y="270" fill="#ffad8d" font-family="Arial, sans-serif" font-size="20" font-weight="700">report/</text>
  <text x="912" y="316" fill="#edf4fb" font-family="Consolas, monospace" font-size="15">episode-report.html</text>
  <text x="912" y="350" fill="#edf4fb" font-family="Consolas, monospace" font-size="15">episode-manifest.json</text>
  <text x="912" y="384" fill="#edf4fb" font-family="Consolas, monospace" font-size="15">validation.json</text>
  <text x="912" y="418" fill="#edf4fb" font-family="Consolas, monospace" font-size="15">art-report.html (optional)</text>
  <text x="64" y="570" fill="#9eafbf" font-family="Arial, sans-serif" font-size="15">The HTML report is a QA/navigation surface; clean H3 prompts remain the generation source of truth.</text>
</svg>
