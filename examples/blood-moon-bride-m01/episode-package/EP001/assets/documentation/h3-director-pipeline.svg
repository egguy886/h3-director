<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">H3 Director pipeline</title>
  <desc id="desc">A five-stage diagram from story beat to validated H3 prompt and continuity handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a2942"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#17243a"/><stop offset="1" stop-color="#243b5a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#76d5ff"/></marker>
    <style>
      .h{font:700 28px Inter,Segoe UI,sans-serif;fill:#f7fbff}.b{font:600 18px Inter,Segoe UI,sans-serif;fill:#d9efff}.s{font:15px Inter,Segoe UI,sans-serif;fill:#a9c9de}.n{font:700 18px Inter,Segoe UI,sans-serif;fill:#0b1020}.line{stroke:#76d5ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="56" y="62" class="h">H3 Director · from story beat to executable take</text>
  <text x="56" y="94" class="s">导演判断先于提示词编译；每一步都有可验证的交付物。</text>
  <g transform="translate(55,150)">
    <rect width="190" height="190" rx="18" fill="url(#card)" stroke="#365d83"/>
    <circle cx="36" cy="38" r="22" fill="#76d5ff"/><text x="30" y="45" class="n">1</text>
    <text x="24" y="88" class="b">Story beat</text><text x="24" y="116" class="s">Audience intention</text><text x="24" y="140" class="s">Trigger → turn → hook</text>
  </g>
  <g transform="translate(285,150)">
    <rect width="190" height="190" rx="18" fill="url(#card)" stroke="#365d83"/>
    <circle cx="36" cy="38" r="22" fill="#8ff0c8"/><text x="30" y="45" class="n">2</text>
    <text x="24" y="88" class="b">Shot contract</text><text x="24" y="116" class="s">Blocking, weight</text><text x="24" y="140" class="s">Camera, light, sound</text>
  </g>
  <g transform="translate(515,150)">
    <rect width="190" height="190" rx="18" fill="url(#card)" stroke="#365d83"/>
    <circle cx="36" cy="38" r="22" fill="#ffd079"/><text x="30" y="45" class="n">3</text>
    <text x="24" y="88" class="b">Reference map</text><text x="24" y="116" class="s">Picture authority</text><text x="24" y="140" class="s">ComfyUI input offset</text>
  </g>
  <g transform="translate(745,150)">
    <rect width="190" height="190" rx="18" fill="url(#card)" stroke="#365d83"/>
    <circle cx="36" cy="38" r="22" fill="#ff9e9e"/><text x="30" y="45" class="n">4</text>
    <text x="24" y="88" class="b">H3 compiler</text><text x="24" y="116" class="s">Official fields</text><text x="24" y="140" class="s">English prompt + dialogue</text>
  </g>
  <g transform="translate(975,150)">
    <rect width="170" height="190" rx="18" fill="url(#card)" stroke="#365d83"/>
    <circle cx="36" cy="38" r="22" fill="#c3a7ff"/><text x="30" y="45" class="n">5</text>
    <text x="24" y="88" class="b">Validate &amp; review</text><text x="24" y="116" class="s">KEEP / repair</text><text x="24" y="140" class="s">Observed endpoint</text>
  </g>
  <path d="M245 245 H280" class="line"/><path d="M475 245 H510" class="line"/><path d="M705 245 H740" class="line"/><path d="M935 245 H970" class="line"/>
  <text x="56" y="420" class="s">Core rule: action legibility beats spectacle; accepted footage outranks planned footage.</text>
</svg>


